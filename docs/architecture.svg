<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="700" fill="#ffffff"/>

  <text x="40" y="34" font-size="20" font-weight="700" fill="#0f172a">notesearch-lab: architecture</text>
  <text x="40" y="54" font-size="12" fill="#64748b">left: the search engine (notesearch/)   |   right: the evaluation (evalkit/)   |   blue = you write, green = files you create</text>

  <!-- ===== LEFT: SEARCH ENGINE ===== -->
  <rect x="40" y="80" width="500" height="64" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="290" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#064e3b">data/  your notes (.md / .txt)</text>
  <text x="290" y="128" font-size="12" text-anchor="middle" fill="#065f46">frozen snapshot, never committed</text>

  <line x1="290" y1="144" x2="290" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="174" width="500" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="290" y="202" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">chunking.py</text>
  <text x="290" y="222" font-size="12" text-anchor="middle" fill="#1e40af">load_notes  →  chunk_docs: whole | paragraph | window  →  chunk_id = doc_id#i</text>

  <!-- branches -->
  <line x1="165" y1="244" x2="165" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="244" x2="415" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="155" y="266" font-size="11" fill="#64748b" text-anchor="end">lexical path (Day 1)</text>
  <text x="405" y="266" font-size="11" fill="#64748b" text-anchor="end">semantic path (Day 2)</text>

  <rect x="40" y="282" width="250" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="165" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">tokenizer.py</text>
  <text x="165" y="324" font-size="11" text-anchor="middle" fill="#1e40af">lowercase, split, switches: stop/stem</text>

  <rect x="290" y="282" width="250" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="415" y="306" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">embed.py</text>
  <text x="415" y="324" font-size="11" text-anchor="middle" fill="#1e40af">bge-small / MiniLM, L2-normalized</text>

  <line x1="165" y1="338" x2="165" y2="366" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="338" x2="415" y2="366" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="368" width="250" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="165" y="392" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">bm25.py</text>
  <text x="165" y="410" font-size="11" text-anchor="middle" fill="#1e40af">inverted index + scoring (k1, b)</text>
  <text x="165" y="424" font-size="11" text-anchor="middle" fill="#64748b">→ bm25.json</text>

  <rect x="290" y="368" width="250" height="62" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="415" y="392" font-size="13" font-weight="700" text-anchor="middle" fill="#064e3b">embeddings.npy</text>
  <text x="415" y="410" font-size="11" text-anchor="middle" fill="#065f46">(n_chunks × dim) matrix, cached</text>
  <text x="415" y="424" font-size="11" text-anchor="middle" fill="#64748b">dot product = cosine</text>

  <line x1="165" y1="430" x2="165" y2="466" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="430" x2="415" y2="466" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="468" width="500" height="132" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="290" y="494" font-size="14" font-weight="700" text-anchor="middle" fill="#1e3a8a">engine.py  (four systems, all rank chunks)</text>
  <text x="60" y="520" font-size="12" fill="#1e40af"><tspan font-weight="700">bm25</tspan>    lexical top-k</text>
  <text x="60" y="540" font-size="12" fill="#1e40af"><tspan font-weight="700">dense</tspan>   cosine vs all chunk vectors</text>
  <text x="60" y="560" font-size="12" fill="#1e40af"><tspan font-weight="700">rerank</tspan>  BM25 top-depth, reordered by cosine</text>
  <text x="60" y="580" font-size="12" fill="#1e40af"><tspan font-weight="700">hybrid</tspan>  RRF: sum of 1 / (60 + rank) over bm25 and dense</text>

  <line x1="290" y1="600" x2="290" y2="626" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="40" y="628" width="500" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="290" y="650" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">collapse to documents (best chunk per note)  →  cli.py</text>
  <text x="290" y="667" font-size="11" text-anchor="middle" fill="#1e40af">search "query" --mode bm25 | dense | rerank | hybrid</text>

  <!-- bus from engine/collapse to eval -->
  <line x1="540" y1="534" x2="590" y2="534" stroke="#475569" stroke-width="1.5"/>
  <line x1="590" y1="534" x2="590" y2="162" stroke="#475569" stroke-width="1.5"/>
  <line x1="590" y1="162" x2="630" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="318" x2="630" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="598" y="520" font-size="10" fill="#64748b" transform="rotate(-90 598 520)">search(query, mode)</text>

  <!-- ===== RIGHT: EVAL ===== -->
  <rect x="632" y="80" width="310" height="52" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="787" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#064e3b">queries.jsonl</text>
  <text x="787" y="120" font-size="11" text-anchor="middle" fill="#065f46">~40 queries: type tag + dev/test split</text>

  <line x1="787" y1="132" x2="787" y2="140" stroke="#475569" stroke-width="1.5"/>
  <rect x="632" y="140" width="310" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="787" y="160" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">pool.py</text>
  <text x="787" y="175" font-size="11" text-anchor="middle" fill="#1e40af">union of all systems' top-k, shuffled</text>

  <line x1="787" y1="184" x2="787" y2="204" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="632" y="206" width="310" height="52" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="787" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#064e3b">label_pool.tsv  →  qrels.tsv</text>
  <text x="787" y="246" font-size="11" text-anchor="middle" fill="#065f46">YOU grade each pair 0 / 1 / 2 (blind)</text>

  <line x1="787" y1="258" x2="787" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="632" y="292" width="310" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="787" y="314" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">run_eval.py</text>
  <text x="787" y="332" font-size="11" text-anchor="middle" fill="#1e40af">per query: rank each system, score it</text>

  <line x1="787" y1="344" x2="787" y2="372" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="632" y="374" width="310" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="787" y="396" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">metrics.py + stats.py</text>
  <text x="787" y="414" font-size="11" text-anchor="middle" fill="#1e40af">MRR, NDCG@10, Recall@k</text>
  <text x="787" y="428" font-size="11" text-anchor="middle" fill="#1e40af">bootstrap CI, paired test, W/L/T</text>

  <line x1="787" y1="436" x2="787" y2="470" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="632" y="472" width="310" height="86" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="787" y="496" font-size="13" font-weight="700" text-anchor="middle" fill="#064e3b">results</text>
  <text x="787" y="516" font-size="11" text-anchor="middle" fill="#065f46">main table + CIs (dev, then test once)</text>
  <text x="787" y="532" font-size="11" text-anchor="middle" fill="#065f46">by-query-type table, ablations</text>
  <text x="787" y="548" font-size="11" text-anchor="middle" fill="#065f46">runs/*.json → failure analysis</text>

  <line x1="787" y1="558" x2="787" y2="586" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="632" y="588" width="310" height="90" rx="8" fill="#fefce8" stroke="#eab308"/>
  <text x="787" y="612" font-size="13" font-weight="700" text-anchor="middle" fill="#713f12">README write-up</text>
  <text x="787" y="632" font-size="11" text-anchor="middle" fill="#854d0e">setup, labeling protocol, results</text>
  <text x="787" y="648" font-size="11" text-anchor="middle" fill="#854d0e">5 failure cases per system, limitations</text>
  <text x="787" y="664" font-size="11" text-anchor="middle" fill="#854d0e">(the part that makes the project stand out)</text>
</svg>
